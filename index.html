<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#87b7e0">
<title>Digger</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#87b7e0;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #game { display:block; width:100%; height:100%; outline:none; }

  .pad { position:fixed; bottom:max(14px, env(safe-area-inset-bottom)); display:flex; gap:14px; z-index:10; }
  #padL { left:max(14px, env(safe-area-inset-left)); }
  #padR { right:max(14px, env(safe-area-inset-right)); }

  .btn {
    width:104px; height:104px; border-radius:26px; border:none;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:pointer;
    background:#ffcf2e;
    box-shadow: 0 7px 0 #b8891a, 0 10px 18px rgba(0,0,0,.28);
    transition: transform .05s, box-shadow .05s, filter .15s;
    color:#3d2a05;
  }
  .btn svg { width:56px; height:56px; display:block; pointer-events:none; }
  .btn.held { transform:translateY(6px); box-shadow: 0 1px 0 #b8891a, 0 3px 8px rgba(0,0,0,.28); filter:brightness(1.06); }

  #dump {
    position:fixed; bottom:max(14px, env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%);
    width:132px; height:78px; border-radius:24px; background:#8a8f96;
    box-shadow:0 7px 0 #5c6067, 0 10px 18px rgba(0,0,0,.28);
    z-index:10; opacity:.5;
  }
  #dump.ready { background:#ff8a3d; box-shadow:0 7px 0 #b25520, 0 10px 18px rgba(0,0,0,.28); opacity:1; }
  #dump.held { transform:translateX(-50%) translateY(6px); box-shadow:0 1px 0 #b25520, 0 3px 8px rgba(0,0,0,.28); }

  #horn {
    position:fixed; top:max(14px, env(safe-area-inset-top));
    right:max(14px, env(safe-area-inset-right));
    width:82px; height:82px; border-radius:50%; background:#ff4d4d;
    box-shadow:0 6px 0 #a82b2b, 0 8px 16px rgba(0,0,0,.28); z-index:10; color:#fff;
  }
  #horn svg { width:44px; height:44px; }
  #horn.held { transform:translateY(5px); box-shadow:0 1px 0 #a82b2b, 0 3px 8px rgba(0,0,0,.28); }

  @keyframes hint { 0%,100% { transform:scale(1); } 50% { transform:scale(1.09); } }
  .hint { animation: hint 1.15s ease-in-out infinite; }

  @media (max-height: 460px) {
    .btn { width:86px; height:86px; border-radius:22px; }
    .btn svg { width:46px; height:46px; }
    #dump { width:112px; height:66px; }
    #horn { width:70px; height:70px; }
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div class="pad" id="padL">
  <button class="btn" id="left" tabindex="-1" aria-label="drive left"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3.5 7 12l8.5 8.5 2.6-2.6L12.2 12l5.9-5.9z"/></svg></button>
  <button class="btn" id="right" tabindex="-1" aria-label="drive right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3.5 17 12l-8.5 8.5-2.6-2.6L11.8 12 5.9 6.1z"/></svg></button>
</div>

<div class="pad" id="padR">
  <button class="btn" id="up" tabindex="-1" aria-label="arm up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5 3.5 13l2.6 2.6L12 9.7l5.9 5.9 2.6-2.6z"/></svg></button>
  <button class="btn" id="down" tabindex="-1" aria-label="arm down"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19.5 20.5 11l-2.6-2.6L12 14.3 6.1 8.4 3.5 11z"/></svg></button>
</div>

<button id="dump" tabindex="-1" aria-label="dump"></button>
<button id="horn" tabindex="-1" aria-label="horn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.3v2.1a7.6 7.6 0 0 1 0 15.2v2.1a9.7 9.7 0 0 0 0-19.4z"/></svg></button>

<script>
"use strict";

/* ---------------------------------------------------------------- world */
const VIEW_H = 700;
const GROUND_Y = 452, BEDROCK_Y = 662;
const COLW = 5;

// The world is divided into biome spans that repeat forever. Everything in the
// near background is a pure function of world x, so the scenery is endless; the
// diggable strip is finite but long enough that a child will never reach an end.
const BIOME_W = 1600;
const BIOMES = ['farm', 'forest', 'river', 'yard', 'ocean'];
const WORLD_W = BIOME_W * BIOMES.length * 4;      // twenty spans
const COLS = WORLD_W / COLW;

const mod = (n, m) => ((n % m) + m) % m;
const biomeIndexAt = x => Math.floor(x / BIOME_W);
const biomeKind = i => BIOMES[mod(i, BIOMES.length)];
const biomeAt = x => biomeKind(biomeIndexAt(x));

const h = new Float32Array(COLS);          // terrain surface y (canvas y-down)
const disturbed = new Uint8Array(COLS);    // 1 = grass has been destroyed

const colAt = x => Math.max(0, Math.min(COLS - 1, Math.floor(x / COLW)));

for (let i = 0; i < COLS; i++) {
  const x = i * COLW;
  h[i] = GROUND_Y
       + Math.sin(x * 0.0016) * 7
       + Math.sin(x * 0.0051 + 1.3) * 4;
}

// a mound to dig in most spans, so there is always something to work on
for (let b = 0; b * BIOME_W < WORLD_W; b++) {
  if (rnd(b + 400) < 0.3) continue;
  const cx = b * BIOME_W + 420 + rnd(b + 11) * 680;
  const r  = 130 + rnd(b + 5) * 90;
  const amp = 40 + rnd(b + 9) * 32;
  for (let i = colAt(cx - r); i <= colAt(cx + r); i++) {
    const d = Math.abs(i * COLW - cx);
    if (d < r) h[i] -= Math.cos(d / r * Math.PI / 2) * amp;
  }
}

// The flatbed. Its deck and ramp are a scripted surface, not a simulation:
// the machine reads its height straight off them, so it can tip over or get
// stuck on neither.
const TRUCK = {
  cabX0: 56, cabX1: 148,
  deckX0: 148, deckX1: 430,
  deckY: GROUND_Y - 58,
  rampX1: 600
};
const NO_DIG_X = TRUCK.rampX1 + 25;   // keep the ramp foot from being undermined

// flatten the ground the truck parks on so the ramp meets it cleanly
for (let i = 0; i <= colAt(NO_DIG_X + 30); i++) { h[i] = GROUND_Y; disturbed[i] = 0; }

const h0 = Float32Array.from(h);   // original ground line, for the cut-away back wall


const groundAt = x => h[colAt(x)];

// height of the truck deck / ramp at x, or null if the truck isn't there
function truckSurfaceAt(x) {
  if (x < TRUCK.deckX0 - 10 || x > TRUCK.rampX1) return null;
  if (x <= TRUCK.deckX1) return TRUCK.deckY;
  const t = (x - TRUCK.deckX1) / (TRUCK.rampX1 - TRUCK.deckX1);
  return TRUCK.deckY + t * (GROUND_Y - TRUCK.deckY);
}

// what the tracks and the bucket rest on: whichever is higher, dirt or truck
function surfaceAt(x) {
  const g = groundAt(x);
  const t = truckSurfaceAt(x);
  return t === null ? g : Math.min(t, g);
}

/* -------------------------------------------------------------- machine */
const RIG = {
  trackW: 122, trackH: 30,
  houseW: 98,  houseH: 46,
  pivot: { x: 34, y: -58 },
  boom: 78, stick: 64, bucket: 34
};
// keyframed arm poses (absolute degrees, y-down so + is downward)
const POSE_UP   = { boom: -62, stick: 28, bucket: 152 };
const POSE_DOWN = { boom:   8, stick: 78, bucket: 128 };

const ex = {
  x: 290, y: GROUND_Y - 58, rot: 0,   // parked on the flatbed
  arm: 0,            // 0 = raised, 1 = fully down
  load: 0,           // dirt in bucket (area units)
  dumpT: 0,          // 0..1 bucket tip-out
  dumping: false,
  tread: 0,
  facing: 1,
  vx: 0,          // real velocity, so the machine has to spin up and coast down
  ax: 0,          // acceleration, for weight transfer
  slip: 0,        // 0..1 how much the tracks are losing grip
  vy: 0,          // suspension travel
  rotV: 0,        // roll rate
  lean: 0, leanV: 0
};
const CAPACITY = 2600;
let prevTip = null, wasContact = false, wasPouring = false, pourWentToBed = false;
let T = 0;                                  // seconds, drives ambient animation

// The dump truck. Fill its bed from the excavator; when it is full it hauls the
// load off, tips it into a pile, and comes back empty, so the loop never ends.
const DUMP_CAP = CAPACITY * 3;          // three bucket loads
const DT_HOME = 900, DT_AWAY = 1400;
const DTRUCK = {
  x: DT_HOME, y: GROUND_Y,
  fill: 0,        // 0..1
  tip: 0,         // 0..1 bed raised
  state: 'parked',
  wait: 0
};

const lerp = (a, b, t) => a + (b - a) * t;
const D2R = Math.PI / 180;

function armAngles(t) {
  return {
    boom:   lerp(POSE_UP.boom,   POSE_DOWN.boom,   t) * D2R,
    stick:  lerp(POSE_UP.stick,  POSE_DOWN.stick,  t) * D2R,
    bucket: (lerp(POSE_UP.bucket, POSE_DOWN.bucket, t) + ex.dumpT * 78) * D2R
  };
}

// arm joint positions in machine-local space
function armPoints(t) {
  const a = armAngles(t), p = RIG.pivot;
  const b  = { x: p.x + Math.cos(a.boom)  * RIG.boom,  y: p.y + Math.sin(a.boom)  * RIG.boom  };
  const s  = { x: b.x + Math.cos(a.stick) * RIG.stick, y: b.y + Math.sin(a.stick) * RIG.stick };
  const bt = { x: s.x + Math.cos(a.bucket)* RIG.bucket,y: s.y + Math.sin(a.bucket)* RIG.bucket};
  return { pivot: p, boomTip: b, stickTip: s, tip: bt, ang: a };
}

// mirrors the way the sprite is drawn: translate -> rotate -> flip
function toWorld(pt) {
  const c = Math.cos(ex.rot), s = Math.sin(ex.rot);
  const lx = pt.x * ex.facing, ly = pt.y;
  return { x: ex.x + lx * c - ly * s, y: ex.y + lx * s + ly * c };
}

/* --------------------------------------------------------------- input */
const keys = { left:false, right:false, up:false, down:false, dump:false };
let lastInput = 0;

function bindHold(el, name) {
  const on  = e => { e.preventDefault(); keys[name] = true;  el.classList.add('held');
                     lastInput = performance.now(); audioStart();
                     try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { keys[name] = false; el.classList.remove('held'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindHold(document.getElementById('left'),  'left');
bindHold(document.getElementById('right'), 'right');
bindHold(document.getElementById('up'),    'up');
bindHold(document.getElementById('down'),  'down');
bindHold(document.getElementById('dump'),  'dump');

const hornEl = document.getElementById('horn');
hornEl.addEventListener('pointerdown', e => {
  e.preventDefault(); audioStart(); playHorn();
  hornEl.classList.add('held'); lastInput = performance.now();
});
const hornOff = () => hornEl.classList.remove('held');
hornEl.addEventListener('pointerup', hornOff);
hornEl.addEventListener('pointercancel', hornOff);

const KEYMAP = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', ' ':'dump' };
addEventListener('keydown', e => {
  if (e.key === 'h') { audioStart(); playHorn(); return; }
  const k = KEYMAP[e.key]; if (!k) return;
  e.preventDefault(); keys[k] = true; lastInput = performance.now(); audioStart();
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

// Keyboard events only reach the page once something in it holds focus, so on a
// fresh load the arrow keys did nothing until an on-screen button had been
// tapped. Claim focus straight away, and take it back whenever it is lost.
const stage = document.getElementById('game');

function grabFocus() {
  try { window.focus(); } catch (_) {}
  if (document.activeElement !== stage) stage.focus({ preventScroll: true });
}

grabFocus();
addEventListener('load', grabFocus);
addEventListener('pointerdown', grabFocus, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) grabFocus(); });

// A key held while the window loses focus never sends its keyup, which would
// otherwise leave the machine driving off on its own. Let go of everything.
function releaseAll() { for (const k in keys) keys[k] = false; }
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

// keep little fingers from navigating away
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('touchmove', e => e.preventDefault(), { passive:false });
addEventListener('dblclick', e => e.preventDefault());

/* --------------------------------------------------------------- audio */
let AC = null, engine = null, hyd = null, scrape = null, pour = null, noiseBuf = null;

function audioStart() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();

  const n = AC.sampleRate * 1.2, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  noiseBuf = buf;

  // Diesel. A real one is a train of combustion impulses, not a tone, so the
  // core is a band-limited impulse wave at the firing rate driven through a
  // resonant body filter. Around it sit a detuned second bank for roughness,
  // a combustion hiss, and a turbo that only spools up under load.
  const N = 30, re = new Float32Array(N), im = new Float32Array(N);
  for (let k = 1; k < N; k++) re[k] = 1 / Math.pow(k, 0.62);
  const fireWave = AC.createPeriodicWave(re, im);

  const g = AC.createGain(); g.gain.value = 0;
  const body = AC.createBiquadFilter();
  body.type = 'lowpass'; body.frequency.value = 200; body.Q.value = 7.5;

  const fire = AC.createOscillator(); fire.setPeriodicWave(fireWave); fire.frequency.value = 21;
  const rough = AC.createOscillator(); rough.setPeriodicWave(fireWave); rough.frequency.value = 21.4;
  const roughG = AC.createGain(); roughG.gain.value = 0.5;
  fire.connect(body); rough.connect(roughG); roughG.connect(body);
  body.connect(g);

  // idle is never perfectly steady
  const wob = AC.createOscillator(); wob.type = 'sine'; wob.frequency.value = 1.7;
  const wobG = AC.createGain(); wobG.gain.value = 0.6;
  wob.connect(wobG); wobG.connect(fire.frequency); wobG.connect(rough.frequency);

  const combust = AC.createBufferSource(); combust.buffer = noiseBuf; combust.loop = true;
  const combustF = AC.createBiquadFilter();
  combustF.type = 'bandpass'; combustF.frequency.value = 950; combustF.Q.value = 0.9;
  const combustG = AC.createGain(); combustG.gain.value = 0;
  combust.connect(combustF); combustF.connect(combustG); combustG.connect(AC.destination);

  const turbo = AC.createOscillator(); turbo.type = 'triangle'; turbo.frequency.value = 2100;
  const turboF = AC.createBiquadFilter();
  turboF.type = 'bandpass'; turboF.frequency.value = 2600; turboF.Q.value = 7;
  const turboG = AC.createGain(); turboG.gain.value = 0;
  turbo.connect(turboF); turboF.connect(turboG); turboG.connect(AC.destination);

  g.connect(AC.destination);
  fire.start(); rough.start(); wob.start(); combust.start(); turbo.start();
  engine = { g, fire, rough, body, combustG, combustF, turbo, turboG };

  // hydraulic ram: a resonant whine plus a breathy hiss
  const hg = AC.createGain(); hg.gain.value = 0;
  const hsaw = AC.createOscillator(); hsaw.type = 'sawtooth'; hsaw.frequency.value = 150;
  const hlp = AC.createBiquadFilter(); hlp.type = 'lowpass'; hlp.frequency.value = 620; hlp.Q.value = 9;
  hsaw.connect(hlp); hlp.connect(hg);

  const hn = AC.createBufferSource(); hn.buffer = noiseBuf; hn.loop = true;
  const hnf = AC.createBiquadFilter(); hnf.type = 'bandpass'; hnf.frequency.value = 1500; hnf.Q.value = 1.1;
  const hng = AC.createGain(); hng.gain.value = 0.2;
  hn.connect(hnf); hnf.connect(hng); hng.connect(hg);

  hg.connect(AC.destination);
  hsaw.start(); hn.start();
  hyd = { g: hg, o: hsaw, lp: hlp };

  // bucket grinding along the ground
  const cg = AC.createGain(); cg.gain.value = 0;
  const cn = AC.createBufferSource(); cn.buffer = noiseBuf; cn.loop = true;
  const cf = AC.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 1400; cf.Q.value = 0.7;
  cn.connect(cf); cf.connect(cg); cg.connect(AC.destination);
  cn.start();
  scrape = { g: cg, f: cf };

  // dirt rushing out of the bucket
  const pg = AC.createGain(); pg.gain.value = 0;
  const pn = AC.createBufferSource(); pn.buffer = noiseBuf; pn.loop = true;
  const pf = AC.createBiquadFilter(); pf.type = 'bandpass'; pf.frequency.value = 900; pf.Q.value = 0.5;
  const pl = AC.createBiquadFilter(); pl.type = 'lowpass'; pl.frequency.value = 2600;
  pn.connect(pf); pf.connect(pl); pl.connect(pg); pg.connect(AC.destination);
  pn.start();
  pour = { g: pg, f: pf };
}

function noiseBurst(dur, freq, gain, type) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  const g = AC.createGain();
  const t = AC.currentTime;
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

let lastEffort = 0;
let lastCrunch = 0;
function playCrunch() {
  if (!AC || AC.currentTime - lastCrunch < 0.085) return;
  lastCrunch = AC.currentTime;
  noiseBurst(0.16, 700 + Math.random() * 900, 0.16);
}

function playHorn() {
  if (!AC) return;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
  g.gain.setValueAtTime(0.22, t + 0.42);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.58);
  g.connect(AC.destination);
  [312, 396].forEach(f => {
    const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f;
    o.connect(g); o.start(t); o.stop(t + 0.6);
  });
}

let beepUntil = 0;
function reverseBeep() {
  if (!AC || AC.currentTime < beepUntil) return;
  beepUntil = AC.currentTime + 0.62;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.13, t + 0.01);
  g.gain.setValueAtTime(0.13, t + 0.18);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = 1180;
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.26);
}

let lastThud = 0;
function playThud() {
  if (!AC || AC.currentTime - lastThud < 0.28) return;
  lastThud = AC.currentTime;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.2);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.26);
  noiseBurst(0.2, 430, 0.22, 'lowpass');
}

let lastClunk = 0;
function playClunk() {
  if (!AC || AC.currentTime - lastClunk < 0.35) return;
  lastClunk = AC.currentTime;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.17, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  const o = AC.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(230, t);
  o.frequency.exponentialRampToValueAtTime(88, t + 0.12);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.15);
  noiseBurst(0.09, 2300, 0.08);
}

// dirt landing in a steel bed rather than on soft ground
function playBedClang() {
  if (!AC) return;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  g.connect(AC.destination);
  [318, 487, 733].forEach((f, i) => {                 // inharmonic = metallic
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const og = AC.createGain(); og.gain.value = 0.5 / (i + 1);
    o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.52);
  });
  noiseBurst(0.3, 520, 0.16, 'lowpass');
}

// two low honks as the loaded truck pulls away
function playTruckHorn() {
  if (!AC) return;
  const t = AC.currentTime;
  [0, 0.26].forEach(off => {
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t + off);
    g.gain.exponentialRampToValueAtTime(0.18, t + off + 0.02);
    g.gain.setValueAtTime(0.18, t + off + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.22);
    g.connect(AC.destination);
    [180, 226].forEach(f => {
      const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f;
      o.connect(g); o.start(t + off); o.stop(t + off + 0.24);
    });
  });
}

function playTipRumble() { noiseBurst(1.1, 300, 0.22, 'lowpass'); }

// the bucket rolling open: hydraulic hiss plus a bit of metal
function playTipOut() {
  if (!AC) return;
  const t = AC.currentTime;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.085, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  const n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.6;
  f.frequency.setValueAtTime(2400, t);
  f.frequency.exponentialRampToValueAtTime(880, t + 0.32);
  n.connect(f); f.connect(g); g.connect(AC.destination);
  n.start(t); n.stop(t + 0.36);

  const cg = AC.createGain();
  cg.gain.setValueAtTime(0.05, t);
  cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
  const o = AC.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(430, t);
  o.frequency.exponentialRampToValueAtTime(255, t + 0.17);
  o.connect(cg); cg.connect(AC.destination); o.start(t); o.stop(t + 0.21);
}

// the last of the load landing and the pile settling
function playSettle() {
  if (!AC) return;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.24, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(98, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.28);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.34);
  noiseBurst(0.3, 600, 0.15, 'lowpass');
}

/* ---------------------------------------------------------------- exhaust */
// Puffs live in world coordinates so they drift free of the machine once out
// of the stack. The stack tip is local (-32, -96); toWorld already applies the
// machine's facing, so the local x is passed through unmirrored.
const puffs = [];
let puffTimer = 0;

function emitPuff() {
  const p = toWorld({ x: -32, y: -96 });
  puffs.push({
    x: p.x + (Math.random() - 0.5) * 3,
    y: p.y + (Math.random() - 0.5) * 3,
    vx: (Math.random() - 0.5) * 10 - ex.facing * 5,
    vy: -30 - Math.random() * 16,
    r: 2.5 + Math.random() * 2,
    life: 0,
    max: 1.0 + Math.random() * 0.6
  });
}

function updatePuffs(dt, effort) {
  if (effort > 0) {
    puffTimer -= dt;
    let guard = 0;
    while (puffTimer <= 0 && guard++ < 8) { emitPuff(); puffTimer += 0.07 / effort; }
  } else {
    puffTimer = 0;
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.life += dt;
    if (p.life >= p.max) { puffs.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy *= 1 - 0.9 * dt;        // rise slows
    p.vx *= 1 - 1.2 * dt;
    p.r  += 12 * dt;             // and it spreads out
  }
}

function drawPuffs() {
  for (const p of puffs) {
    const t = p.life / p.max;
    const g = Math.round(90 + t * 90);          // darkens to light as it thins
    ctx.globalAlpha = (1 - t) * (1 - t) * 0.5;
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------- loose dirt */
// Dumped material no longer teleports into the heightmap. It leaves the bucket
// as clods that fall, tumble and only merge into the ground where they land.
const clods = [];

function spawnClod(x, y, amount, vx, vy) {
  if (clods.length > 150) { drop({ x, y }, amount, 16); return; }
  clods.push({
    x, y, amount,
    vx: vx + (Math.random() - 0.5) * 26,
    vy: vy + (Math.random() - 0.5) * 20,
    r: 2.4 + Math.random() * 2.8,
    spin: Math.random() * 6.28,
    sv: (Math.random() - 0.5) * 9
  });
}

function updateClods(dt) {
  for (let i = clods.length - 1; i >= 0; i--) {
    const c = clods[i];
    c.vy += 940 * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.spin += c.sv * dt;
    if (c.y >= surfaceAt(c.x)) {
      drop({ x: c.x, y: c.y }, c.amount, 15);
      clods.splice(i, 1);
    }
  }
}

function drawClods() {
  for (const c of clods) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.spin);
    ctx.fillStyle = '#7d5230';
    ctx.beginPath();
    ctx.moveTo(-c.r, -c.r * 0.6); ctx.lineTo(c.r * 0.7, -c.r);
    ctx.lineTo(c.r, c.r * 0.5); ctx.lineTo(-c.r * 0.5, c.r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,220,.22)';
    ctx.fillRect(-c.r * 0.6, -c.r * 0.6, c.r, c.r * 0.5);
    ctx.restore();
  }
}

/* --------------------------------------------------------------- physics */
const REPOSE = 3.4;   // max height difference between neighbouring columns

function relax(passes, lo, hi) {
  const A = Math.max(0, lo === undefined ? 0 : lo);
  const B = Math.min(COLS - 2, hi === undefined ? COLS - 2 : hi);
  for (let p = 0; p < passes; p++) {
    const fwd = (p & 1) === 0;
    const a = fwd ? A : B, b = fwd ? B : A, st = fwd ? 1 : -1;
    for (let i = a; fwd ? i <= b : i >= b; i += st) {
      const j = i + 1;
      if (j >= COLS) continue;
      const diff = h[i] - h[j];
      if (diff > REPOSE) {                     // column j is too tall
        const t = (diff - REPOSE) * 0.3;
        h[j] += t; h[i] -= t;
        if (t > 0.05) { disturbed[i] = 1; disturbed[j] = 1; }
      } else if (-diff > REPOSE) {             // column i is too tall
        const t = (-diff - REPOSE) * 0.3;
        h[i] += t; h[j] -= t;
        if (t > 0.05) { disturbed[i] = 1; disturbed[j] = 1; }
      }
    }
  }
}

const DIG_R = 26;

function dig(tip, dt) {
  if (ex.load >= CAPACITY) return false;
  const i0 = colAt(tip.x - DIG_R), i1 = colAt(tip.x + DIG_R);
  const rate = 300 * dt;
  let removed = 0;
  for (let i = i0; i <= i1; i++) {
    if ((i + 0.5) * COLW < NO_DIG_X) continue;     // the truck's ground is off limits
    const dx = (i + 0.5) * COLW - tip.x;
    const depth = Math.sqrt(Math.max(0, DIG_R * DIG_R - dx * dx)) * 0.55;
    const target = Math.min(tip.y + depth, BEDROCK_Y);
    if (target > h[i]) {
      const nh = Math.min(target, h[i] + rate);
      removed += (nh - h[i]) * COLW;
      h[i] = nh;
      disturbed[i] = 1;
    }
  }
  if (removed > 0) {
    ex.load = Math.min(CAPACITY, ex.load + removed);
    relax(4, i0 - 90, i1 + 90);
    return true;
  }
  return false;
}

function drop(tip, amount, spread) {
  const R = spread || 22;
  const dx = Math.max(tip.x, NO_DIG_X + R);        // never pile dirt on the ramp
  const i0 = colAt(dx - R), i1 = colAt(dx + R);
  const n = i1 - i0 + 1;
  if (n <= 0) return;
  const per = amount / (n * COLW);
  for (let i = i0; i <= i1; i++) { h[i] -= per; disturbed[i] = 1; }
  relax(6, i0 - 110, i1 + 110);
}

function settleMachine(dt) {
  const half = RIG.trackW / 2 - 6;

  // tilt: centroids of the two halves are (6 + half) apart, so a ramp reads at
  // its true angle rather than a flattened approximation
  let fSum = 0, rSum = 0, n = 0;
  for (let d = 6; d <= half; d += 6) {
    fSum += surfaceAt(ex.x + d); rSum += surfaceAt(ex.x - d); n++;
  }
  const targetRot = Math.max(-0.52, Math.min(0.52,
    Math.atan2(fSum / n - rSum / n, 6 + half)));

  // height: rest the underside on the highest point it actually touches,
  // measured along the tilt - otherwise the machine floats on a slope
  const sr = Math.sin(targetRot);
  let top = 1e9;
  for (let d = -half; d <= half; d += 6) {
    const y = surfaceAt(ex.x + d) - d * sr;
    if (y < top) top = y;
  }
  const targetY = top;

  // Suspension: a slightly underdamped spring, so dropping off the ramp lands
  // with a compression and one settle rather than snapping to height.
  ex.vy += (-260 * (ex.y - targetY) - 24 * ex.vy) * dt;
  ex.y += ex.vy * dt;
  if (ex.y > targetY + 6) { ex.y = targetY + 6; ex.vy = 0; }

  // Weight transfer: a loaded bucket held out front pitches the machine down
  // onto its nose, and braking or accelerating rocks it on its tracks.
  const reach = 0.35 + ex.arm * 0.65;
  const leanTarget = (ex.load / CAPACITY) * 0.075 * reach * ex.facing
                   - ex.ax * 0.00042 * ex.facing;
  ex.leanV += (-90 * (ex.lean - leanTarget) - 13 * ex.leanV) * dt;
  ex.lean += ex.leanV * dt;

  ex.rotV += (-150 * (ex.rot - (targetRot + ex.lean)) - 20 * ex.rotV) * dt;
  ex.rot += ex.rotV * dt;
}

/* ---------------------------------------------------------------- update */
function update(dt) {
  T += dt;
  // drive
  let drive = 0;
  if (keys.left)  drive -= 1;
  if (keys.right) drive += 1;

  // Grade under the tracks. Climbing steeply costs grip until the grousers
  // start to slip, which is self-correcting: slipping puts the machine back on
  // ground it can hold, so it can never be stranded.
  const slope = (surfaceAt(ex.x + 44) - surfaceAt(ex.x - 44)) / 88;
  const climbing = -slope * (drive || Math.sign(ex.vx) || 1);
  let grip = 1;
  if (climbing > 0.30) grip = Math.max(0.05, 1 - (climbing - 0.30) * 2.6);
  ex.slip = drive !== 0 ? 1 - grip : 0;

  // mass: it takes a moment to get 20 tonnes moving, and to stop it again
  const want = drive * 132 * grip + (drive !== 0 ? slope * 46 : 0);
  const rate = drive !== 0 ? 3.4 : 6.0;
  const prevVx = ex.vx;
  ex.vx += (want - ex.vx) * Math.min(1, rate * dt);
  if (drive === 0 && Math.abs(ex.vx) < 2) ex.vx = 0;
  ex.ax = (ex.vx - prevVx) / Math.max(dt, 1e-4);

  if (ex.vx !== 0) {
    ex.x = Math.max(TRUCK.deckX0 + 62, Math.min(WORLD_W - 140, ex.x + ex.vx * dt));
    ex.tread += ex.vx * dt * grip;              // tracks spin on when they slip
    if (drive !== 0) ex.tread += drive * 46 * dt * (1 - grip);
  }
  if (drive !== 0) ex.facing = drive;
  if (ex.vx < -6) reverseBeep();

  // arm
  const armMove = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (armMove !== 0) {
    const was = ex.arm;
    ex.arm = Math.max(0, Math.min(1, ex.arm + armMove * 0.62 * dt));
    if (ex.arm !== was && (ex.arm === 0 || ex.arm === 1)) playClunk();
  }

  // dump
  let pourRate = 0;
  if (keys.dump && ex.load > 0 && !ex.dumping) { ex.dumping = true; playTipOut(); }
  if (ex.dumping) {
    ex.dumpT = Math.min(1, ex.dumpT + dt * 3.2);
    if (ex.dumpT > 0.35 && ex.load > 0) {
      const give = Math.min(ex.load, CAPACITY * 2.2 * dt);
      ex.load -= give;
      pourRate = give / dt;
      const tip = toWorld(armPoints(ex.arm).tip);
      if (bucketOverBed(tip)) {
        DTRUCK.fill = Math.min(1, DTRUCK.fill + give / DUMP_CAP);
        pourWentToBed = true;
      } else {
        const vy0 = -20 - ex.dumpT * 30;
        spawnClod(tip.x, tip.y, give, ex.vx * 0.4 + ex.facing * 26, vy0);
      }
    }
    if (ex.load <= 0.5 && ex.dumpT >= 1) ex.dumping = false;
  } else {
    ex.dumpT = Math.max(0, ex.dumpT - dt * 3.2);
  }
  // the instant the last of it leaves the bucket, the load lands
  if (wasPouring && pourRate === 0) {
    if (pourWentToBed) playBedClang(); else playSettle();
    pourWentToBed = false;
  }
  wasPouring = pourRate > 0;

  updateDumpTruck(dt);
  updateDeer(dt);
  updateClods(dt);

  settleMachine(dt);

  // where the bucket is, and whether it is touching dirt.
  // hysteresis matters here: cutting drops the surface away from the bucket,
  // so a single threshold flickers and machine-guns the landing thud.
  const tip = toWorld(armPoints(ex.arm).tip);
  const depth = tip.y - surfaceAt(tip.x);           // > 0 means below the surface
  const contact = wasContact ? depth > -15 : depth > -3;
  const tipSpeed = prevTip
    ? Math.hypot(tip.x - prevTip.x, tip.y - prevTip.y) / Math.max(dt, 1e-4)
    : 0;
  if (contact && !wasContact && tipSpeed > 20) playThud();   // the moment it lands
  wasContact = contact;
  prevTip = tip;

  // digging happens whenever the bucket is pushed into the ground
  let cutting = false;
  if (armMove > 0 && !ex.dumping && contact) cutting = dig(tip, dt);
  if (cutting) playCrunch();

  // how hard the machine is working: drives both the engine note and the smoke
  const effort = (drive !== 0 ? 1 : 0) * 0.55 + (armMove !== 0 ? 1 : 0) * 0.45;
  updatePuffs(dt, effort);

  // audio mix
  if (AC && engine) {
    const load = effort;
    const now = AC.currentTime;
    // firing rate climbs with demand, and the tracks slipping revs it further
    const rev = Math.min(1, load + ex.slip * 0.45);
    engine.g.gain.setTargetAtTime(0.085 + rev * 0.055, now, 0.12);
    engine.fire.frequency.setTargetAtTime(21 + rev * 20, now, 0.22);
    engine.rough.frequency.setTargetAtTime(21.4 + rev * 20.6, now, 0.22);
    engine.body.frequency.setTargetAtTime(200 + rev * 430, now, 0.2);
    engine.combustG.gain.setTargetAtTime(0.012 + rev * 0.03, now, 0.15);
    engine.combustF.frequency.setTargetAtTime(950 + rev * 700, now, 0.2);
    engine.turboG.gain.setTargetAtTime(rev * rev * 0.022, now, 0.35);
    engine.turbo.frequency.setTargetAtTime(2100 + rev * 2000, now, 0.4);

    // a bark out of the stack when the operator suddenly asks for power
    if (effort - lastEffort > 0.3) noiseBurst(0.22, 260, 0.16, 'lowpass');
    lastEffort = effort;
    // hydraulics: louder and lower going down, tighter coming up
    const moving = armMove !== 0;
    hyd.g.gain.setTargetAtTime(moving ? 0.09 : 0, AC.currentTime, moving ? 0.025 : 0.08);
    hyd.o.frequency.setTargetAtTime(148 + ex.arm * 84 + (armMove < 0 ? 46 : 0), AC.currentTime, 0.07);
    hyd.lp.frequency.setTargetAtTime(520 + ex.arm * 340, AC.currentTime, 0.07);

    // grind: only while the bucket is on the ground, louder the faster it moves
    const grind = contact ? Math.min(1, tipSpeed / 85) : 0;
    scrape.g.gain.setTargetAtTime(grind * 0.12, AC.currentTime, 0.045);
    scrape.f.frequency.setTargetAtTime(1050 + grind * 1500, AC.currentTime, 0.06);

    // pour: tracks the real rate of dirt leaving, and drops in pitch as it empties
    const flow = Math.min(1, pourRate / (CAPACITY * 2.2));
    pour.g.gain.setTargetAtTime(flow * 0.17, AC.currentTime, 0.03);
    pour.f.frequency.setTargetAtTime(620 + (ex.load / CAPACITY) * 1300, AC.currentTime, 0.05);
  }

  document.getElementById('dump').classList.toggle('ready', ex.load > 40);

  // idle hint
  const idle = performance.now() - lastInput > 6000;
  ['left','right','up','down'].forEach(id =>
    document.getElementById(id).classList.toggle('hint', idle));
}

/* ----------------------------------------------------------------- render */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let camX = 0, VW = 0, scale = 1;

function resize() {
  const w = innerWidth, hh = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = hh * dpr;
  cv.style.width = w + 'px'; cv.style.height = hh + 'px';
  scale = hh / VIEW_H;
  VW = w / scale;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

const BANDS = [
  { y0: 0,   y1: 500, c: '#9a6b41' },
  { y0: 500, y1: 556, c: '#87593a' },
  { y0: 556, y1: 614, c: '#a8632c' },
  { y0: 614, y1: 720, c: '#6f6a63' }
];

const BANDS_DARK = BANDS.map(b => ({ y0: b.y0, y1: b.y1, c: shade(b.c, 0.62) }));

// One light direction for the whole scene: sun high and to the left. Every
// solid form is lit on its upper-left and shaded on its lower-right.
const LIGHT = { x: -0.55, y: -0.83 };

function mix(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const r = Math.round(((A >> 16) & 255) * (1 - t) + ((B >> 16) & 255) * t);
  const g = Math.round(((A >> 8) & 255) * (1 - t) + ((B >> 8) & 255) * t);
  const c = Math.round((A & 255) * (1 - t) + (B & 255) * t);
  return `rgb(${r},${g},${c})`;
}

// a top-left lit / bottom-right shaded gradient across a box
function formGrad(x0, y0, x1, y1, base, lift, drop) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, mix(base, '#ffffff', lift === undefined ? 0.22 : lift));
  g.addColorStop(0.55, base);
  g.addColorStop(1, mix(base, '#241a10', drop === undefined ? 0.26 : drop));
  return g;
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * k),
        g = Math.round(((n >> 8) & 255) * k),
        b = Math.round((n & 255) * k);
  return `rgb(${r},${g},${b})`;
}

const CLOUDS = [[190,88,1],[560,54,.8],[940,116,1.2],[1330,70,.9],[1700,100,1],
                [2080,58,1.1],[2460,124,.85],[2840,82,1],[3220,64,1.15]];
const TREES  = [300, 1120, 2260, 2660];

// --- parallax -------------------------------------------------------------
// A layer with factor f scrolls at f times world speed (0 = infinitely far,
// 1 = moves with the ground). The canvas is already translated by -camX, so an
// anchor ax must be drawn at ax + camX*(1-f) to end up scrolling at rate f.
const par = (ax, f) => ax + camX * (1 - f);

// deterministic placement, so scenery never shuffles between frames
function rnd(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

const tri = u => 1 - 2 * Math.abs(u - Math.floor(u) - 0.5);   // 0..1 triangle

// builds a closed silhouette from a height function sampled across the view
function ridgePath(f, fn) {
  ctx.beginPath();
  ctx.moveTo(camX - 30, VIEW_H);
  for (let x = camX - 30; x <= camX + VW + 30; x += 8) {
    ctx.lineTo(x, fn(x - camX * (1 - f)));
  }
  ctx.lineTo(camX + VW + 30, VIEW_H);
  ctx.closePath();
}

function snowCap(f, fn, lineY) {
  ctx.save();
  ridgePath(f, fn);
  ctx.clip();
  ctx.fillStyle = '#eef4fb';
  ctx.fillRect(camX - 30, 0, VW + 60, lineY);
  ctx.restore();
}

const BACK_RANGE  = p => 396 - 236 * (0.24 + 0.76 * tri(p * 0.0019))
                             * (0.66 + 0.34 * Math.sin(p * 0.00052 + 2.1));
const FRONT_RANGE = p => 408 - 178 * (0.24 + 0.76 * tri(p * 0.0027 + 0.37))
                             * (0.64 + 0.36 * Math.sin(p * 0.0009));
const FAR_HILLS   = p => 404 - 38 * (0.5 + 0.5 * Math.sin(p * 0.0021))
                             - 12 * Math.sin(p * 0.0057 + 1.7);

const RIVER_Y = 416;

function rangeShade(top, bot, lit, dark) {
  const g = ctx.createLinearGradient(camX, top, camX + VW * 0.75, bot);
  g.addColorStop(0, lit); g.addColorStop(1, dark);
  return g;
}

function drawMountains() {
  // the far range sits in more haze, so it is paler and lower in contrast
  ridgePath(0.05, BACK_RANGE);
  ctx.fillStyle = rangeShade(170, 400, '#b9cbdf', '#93a9c4'); ctx.fill();
  snowCap(0.05, BACK_RANGE, 272);

  ridgePath(0.10, FRONT_RANGE);
  ctx.fillStyle = rangeShade(220, 410, '#93a9c8', '#6b83a8'); ctx.fill();
  snowCap(0.10, FRONT_RANGE, 306);

  // a wash of haze over both, heaviest at their feet
  ctx.save();
  ridgePath(0.10, FRONT_RANGE); ctx.clip();
  const hz = ctx.createLinearGradient(0, 300, 0, 415);
  hz.addColorStop(0, 'rgba(207,230,242,0)');
  hz.addColorStop(1, 'rgba(207,230,242,.55)');
  ctx.fillStyle = hz; ctx.fillRect(camX - 30, 300, VW + 60, 120);
  ctx.restore();
}

// Clouds and birds tile forever: only the anchors overlapping the view are
// generated, so there is no finite list to run out of.
function tileRange(f, spacing, pad) {
  const off = camX * (1 - f);
  return [Math.floor((camX - pad - off) / spacing), Math.ceil((camX + VW + pad - off) / spacing)];
}

function drawClouds() {
  const f = 0.18, S = 360;
  const [n0, n1] = tileRange(f, S, 180);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (let n = n0; n <= n1; n++) {
    const x = par(n * S + rnd(n) * 150, f);
    const cy = 44 + rnd(n + 31) * 92, sc = 0.78 + rnd(n + 17) * 0.5;
    ctx.beginPath();
    ctx.arc(x, cy, 26 * sc, 0, 7);
    ctx.arc(x + 30 * sc, cy - 10 * sc, 32 * sc, 0, 7);
    ctx.arc(x + 64 * sc, cy + 2 * sc, 24 * sc, 0, 7);
    ctx.fill();
  }
}

function drawBirds() {
  const f = 0.22, S = 330;
  const [n0, n1] = tileRange(f, S, 60);
  ctx.strokeStyle = 'rgba(70,90,110,.55)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let n = n0; n <= n1; n++) {
    if (rnd(n + 61) < 0.45) continue;
    const x = par(n * S + rnd(n + 3) * 190, f);
    const y = 118 + rnd(n + 4) * 128, w = 5 + rnd(n + 9) * 4;
    const flap = Math.sin(T * 3.4 + n) * 2;
    ctx.beginPath();
    ctx.moveTo(x - w * 2, y);
    ctx.quadraticCurveTo(x - w, y - w - flap, x, y);
    ctx.quadraticCurveTo(x + w, y - w - flap, x + w * 2, y);
    ctx.stroke();
  }
}

function drawHouse(x, gy, i) {
  const w = 32 + rnd(i) * 22, hh = 26 + rnd(i + 7) * 16, y = gy - hh;
  const wall = ['#f3e5cb', '#e7d2af', '#f6ded3', '#dfe7d9', '#eadfc4'][i % 5];
  const roof = ['#a5503f', '#8d4436', '#6d4a3a', '#9f5a45', '#7c4740'][i % 5];

  ctx.fillStyle = wall;
  ctx.fillRect(x - w / 2, y, w, hh);
  ctx.fillStyle = roof;                                   // pitched roof
  ctx.beginPath();
  ctx.moveTo(x - w / 2 - 5, y);
  ctx.lineTo(x, y - (13 + rnd(i + 3) * 11));
  ctx.lineTo(x + w / 2 + 5, y);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(x + w * 0.2, y - 17, 5, 11);               // chimney
  ctx.fillStyle = '#7d5c3c';                              // door
  ctx.fillRect(x - 4, gy - hh * 0.5, 8, hh * 0.5);
  ctx.fillStyle = '#ffe9a8';                              // lit windows
  ctx.fillRect(x - w / 2 + 5, y + 6, 7, 7);
  ctx.fillRect(x + w / 2 - 12, y + 6, 7, 7);
}

function drawChurch(x, gy) {
  ctx.fillStyle = '#f0ead9';
  ctx.fillRect(x - 20, gy - 42, 40, 42);
  ctx.fillStyle = '#6d4a3a';
  ctx.beginPath();
  ctx.moveTo(x - 25, gy - 42); ctx.lineTo(x, gy - 56); ctx.lineTo(x + 25, gy - 42);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f0ead9';                               // tower
  ctx.fillRect(x - 8, gy - 78, 16, 40);
  ctx.fillStyle = '#6d4a3a';                               // spire
  ctx.beginPath();
  ctx.moveTo(x - 11, gy - 78); ctx.lineTo(x, gy - 102); ctx.lineTo(x + 11, gy - 78);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8c34a';
  ctx.fillRect(x - 1.5, gy - 110, 3, 9);                   // cross
  ctx.fillRect(x - 5, gy - 107, 10, 3);
  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(x - 5, gy - 34, 10, 12);
}

function drawFarTree(x, gy, i) {
  const hh = 20 + rnd(i) * 12;
  ctx.fillStyle = '#6b4a30';
  ctx.fillRect(x - 2.5, gy - hh, 5, hh);
  ctx.fillStyle = '#5d9450';
  ctx.beginPath();
  ctx.arc(x, gy - hh - 7, 13, 0, 7);
  ctx.arc(x - 10, gy - hh + 2, 9, 0, 7);
  ctx.arc(x + 10, gy - hh + 2, 9, 0, 7);
  ctx.fill();
}

/* ------------------------------------------------------- the near backdrop */
// One band of ground runs behind the dig site the whole length of the world.
// Its contents are a pure function of world x, so it never repeats out of step
// and never runs out. It scrolls with the world (no parallax) so that the farm
// you can see really is the farm you are standing in.
const BAND_Y = RIVER_Y;

// Water is described by the y its surface sits at, so an ocean can rise well
// above the band toward the horizon while a river stays a ribbon in it.
const WATER_BOT = GROUND_Y + 16;

function biomeWaterY(kind) {
  return kind === 'ocean' ? 372 : kind === 'river' ? BAND_Y + 6 : WATER_BOT;
}

// eased across boundaries, so a river mouth widens into open sea
function waterSurfaceAt(x) {
  const i = biomeIndexAt(x), t = x / BIOME_W - i, F = 0.18;
  const sm = u => u * u * (3 - 2 * u);
  const cur = biomeWaterY(biomeKind(i));
  let y = cur;
  if (t < F)          y = lerp(biomeWaterY(biomeKind(i - 1)), cur, sm(t / F));
  else if (t > 1 - F) y = lerp(cur, biomeWaterY(biomeKind(i + 1)), sm((t - (1 - F)) / F));
  // keep the loading area dry: the span before the start is ocean, and without
  // this the flatbed would be parked in the sea
  const dry = Math.min(1, Math.max(0, (x - 640) / 420));
  return WATER_BOT - (WATER_BOT - y) * dry;
}

// somewhere a building or an animal can stand without being in the water
const onLand = x => waterSurfaceAt(x) > BAND_Y + 2;

function drawBand() {
  const top = BAND_Y, bot = GROUND_Y + 16;

  ctx.fillStyle = '#6f9c66';                       // grassy far bank
  ctx.fillRect(camX - 30, top - 5, VW + 60, bot - top + 5);
  ctx.fillStyle = '#7cae70';
  ctx.fillRect(camX - 30, top - 5, VW + 60, 6);

  // a worked-over dirt lot wherever the span is a construction yard
  for (let x = camX - 30; x <= camX + VW + 30; x += 16) {
    if (biomeAt(x) !== 'yard' || !onLand(x)) continue;
    ctx.fillStyle = '#9a7a52';
    ctx.fillRect(x, top - 4, 17, bot - top);
  }

  // water, its surface climbing toward the horizon in the open sea
  ctx.beginPath();
  ctx.moveTo(camX - 30, bot);
  for (let x = camX - 30; x <= camX + VW + 30; x += 8) ctx.lineTo(x, waterSurfaceAt(x));
  ctx.lineTo(camX + VW + 30, bot);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 366, 0, bot);
  g.addColorStop(0, '#79c2e4'); g.addColorStop(1, '#2f6ba0');
  ctx.fillStyle = g; ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.4)';          // ripples
  const n0 = Math.floor((camX - 40) / 74), n1 = Math.ceil((camX + VW + 40) / 74);
  for (let n = n0; n <= n1; n++) {
    const x = n * 74 + rnd(n) * 52;
    const surf = waterSurfaceAt(x);
    if (surf > bot - 6) continue;
    ctx.fillRect(x, surf + 5 + rnd(n + 13) * (bot - surf - 8),
                 9 + rnd(n + 5) * 15, 2 + Math.sin(T * 1.6 + n) * 0.6);
  }
}

/* ------------------------------------------------------------- inhabitants */
function drawHorse(x, gy, seed) {
  const dip = Math.max(0, Math.sin(T * 0.5 + seed * 2.7));      // head down to graze
  const by = gy - 20, c = ['#8a5a34', '#6b4526', '#43382f', '#a9714a'][seed % 4];
  const step = Math.sin(T * 1.1 + seed) * 1.6;

  ctx.fillStyle = c;
  ctx.fillRect(x - 8, by + 7, 3.4, 13 + step);
  ctx.fillRect(x - 2.5, by + 7, 3.4, 13 - step);
  ctx.fillRect(x + 6, by + 7, 3.4, 13 - step);
  ctx.fillRect(x + 11, by + 7, 3.4, 13 + step);
  ctx.beginPath(); ctx.ellipse(x + 2, by + 5, 13, 7.5, 0, 0, 7); ctx.fill();
  ctx.beginPath();                                              // tail
  ctx.moveTo(x - 11, by); ctx.lineTo(x - 18, by + 11);
  ctx.lineTo(x - 12, by + 8); ctx.closePath(); ctx.fill();

  const ang = -1.15 + dip * 1.72;
  const nx = x + 11 + Math.cos(ang) * 13, ny = by + Math.sin(ang) * 13;
  ctx.strokeStyle = c; ctx.lineWidth = 6.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 10, by); ctx.lineTo(nx, ny); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(nx, ny, 5.6, 3.5, ang, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b241e';
  ctx.beginPath(); ctx.arc(nx + Math.cos(ang) * 1.5, ny + Math.sin(ang) * 1.5 - 1, 0.9, 0, 7); ctx.fill();
}

// One deer, held globally: it bolts when the machine arrives in a forest span.
const deer = { active: false, t: 0, dir: 1, from: 0, span: 0, lastBiome: -999 };

function updateDeer(dt) {
  const bi = biomeIndexAt(ex.x);
  if (bi !== deer.lastBiome) {
    deer.lastBiome = bi;
    if (biomeKind(bi) === 'forest') {
      deer.active = true; deer.t = 0;
      deer.dir = ex.facing >= 0 ? 1 : -1;
      deer.from = ex.x - deer.dir * 340;
    }
  }
  if (deer.active) { deer.t += dt; if (deer.t > 4.6) deer.active = false; }
}

function drawDeer() {
  if (!deer.active) return;
  const x = deer.from + deer.dir * 250 * deer.t;
  if (x < camX - 80 || x > camX + VW + 80) return;
  const bound = Math.abs(Math.sin(deer.t * 5.2));
  const gy = BAND_Y - 2, by = gy - 22 - bound * 15;
  const sw = Math.cos(deer.t * 5.2) * 8;

  ctx.save();
  ctx.translate(x, 0); ctx.scale(deer.dir, 1); ctx.translate(-x, 0);
  ctx.strokeStyle = '#8d5a30'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();                                              // splayed legs
  ctx.moveTo(x - 6, by + 6); ctx.lineTo(x - 10 - sw, by + 20);
  ctx.moveTo(x + 7, by + 6); ctx.lineTo(x + 11 + sw, by + 20);
  ctx.moveTo(x - 4, by + 6); ctx.lineTo(x - 7 + sw, by + 20);
  ctx.moveTo(x + 5, by + 6); ctx.lineTo(x + 8 - sw, by + 20);
  ctx.stroke();
  ctx.fillStyle = '#a9713f';
  ctx.beginPath(); ctx.ellipse(x, by + 2, 12, 6.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';                                       // flagged tail
  ctx.beginPath(); ctx.ellipse(x - 12, by - 1, 3.5, 4.5, 0.4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a9713f'; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(x + 9, by); ctx.lineTo(x + 17, by - 12); ctx.stroke();
  ctx.fillStyle = '#a9713f';
  ctx.beginPath(); ctx.ellipse(x + 19, by - 14, 5, 3.2, -0.6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6d4526'; ctx.lineWidth = 1.8;             // antlers
  ctx.beginPath();
  ctx.moveTo(x + 17, by - 17); ctx.lineTo(x + 15, by - 25); ctx.moveTo(x + 15, by - 22); ctx.lineTo(x + 20, by - 25);
  ctx.moveTo(x + 20, by - 16); ctx.lineTo(x + 23, by - 24);
  ctx.stroke();
  ctx.restore();
}

function drawWhale(bi, bx) {
  const per = 11, ph = mod(T + rnd(bi + 3) * per, per) / per;
  if (ph > 0.55) return;                                        // mostly submerged
  const u = ph / 0.55, rise = Math.sin(u * Math.PI);
  const wx = bx + 420 + rnd(bi + 7) * 520;
  if (wx < camX - 120 || wx > camX + VW + 120) return;
  const wy = waterSurfaceAt(wx) + 6 - rise * 15;

  ctx.fillStyle = '#46586b';
  ctx.beginPath(); ctx.ellipse(wx, wy + 6, 34, 11, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath();                                              // flukes
  ctx.moveTo(wx - 32, wy + 6);
  ctx.lineTo(wx - 48, wy - 4 - rise * 5);
  ctx.lineTo(wx - 40, wy + 6);
  ctx.closePath(); ctx.fill();
  if (rise > 0.55) {                                            // spout
    const s = (rise - 0.55) / 0.45;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let k = 0; k < 7; k++) {
      const a = -1.9 + k * 0.28, d = 6 + s * 22;
      ctx.beginPath();
      ctx.arc(wx + 14 + Math.cos(a) * d * 0.5, wy - 2 + Math.sin(a) * d, 2.6 - k * 0.15, 0, 7);
      ctx.fill();
    }
  }
}

function drawDozer(x, gy, seed) {
  const sw = Math.sin(T * 0.42 + seed) * 58;
  const dir = Math.cos(T * 0.42 + seed) >= 0 ? 1 : -1;
  const px = x + sw;
  if (px < camX - 90 || px > camX + VW + 90) return;
  ctx.save();
  ctx.translate(px, gy); ctx.scale(dir, 1);
  ctx.fillStyle = '#2f3338';
  rrect(-22, -13, 44, 13, 6); ctx.fill();
  ctx.fillStyle = '#8b9199';
  for (const wx of [-14, 0, 14]) { ctx.beginPath(); ctx.arc(wx, -6.5, 3.6, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#e8b21f'; ctx.strokeStyle = '#8a6a05'; ctx.lineWidth = 1.6;
  rrect(-16, -28, 30, 16, 4); ctx.fill(); ctx.stroke();
  rrect(-11, -40, 15, 13, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#bfe9ff'; rrect(-8, -37, 9, 7, 2); ctx.fill();
  ctx.fillStyle = '#c8891a';                                    // blade
  rrect(20, -22, 7, 22, 2); ctx.fill();
  ctx.restore();
}

function drawMiniExcavator(x, gy, seed) {
  const sw = Math.sin(T * 0.75 + seed * 1.7);
  if (x < camX - 90 || x > camX + VW + 90) return;
  ctx.save();
  ctx.translate(x, gy);
  ctx.fillStyle = '#2f3338'; rrect(-20, -12, 40, 12, 5); ctx.fill();
  ctx.fillStyle = '#ffc61a'; ctx.strokeStyle = '#8a6a05'; ctx.lineWidth = 1.6;
  rrect(-16, -30, 30, 18, 5); ctx.fill(); ctx.stroke();
  rrect(-4, -44, 15, 15, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#bfe9ff'; rrect(-1, -41, 9, 8, 2); ctx.fill();
  ctx.strokeStyle = '#e8b21f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const a1 = -1.15 + sw * 0.34, a2 = 0.5 - sw * 0.5;
  const jx = 12 + Math.cos(a1) * 24, jy = -30 + Math.sin(a1) * 24;
  ctx.beginPath(); ctx.moveTo(12, -30); ctx.lineTo(jx, jy); ctx.stroke();
  ctx.lineWidth = 5;
  const kx = jx + Math.cos(a2) * 22, ky = jy + Math.sin(a2) * 22;
  ctx.beginPath(); ctx.moveTo(jx, jy); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.fillStyle = '#e0a800';
  ctx.beginPath(); ctx.ellipse(kx + 3, ky + 4, 7, 5.5, 0.5, 0, 7); ctx.fill();
  ctx.restore();
}

/* --------------------------------------------------------- biome furniture */
function drawBarn(x, gy) {
  ctx.fillStyle = '#b23a34'; ctx.strokeStyle = '#7d221e'; ctx.lineWidth = 2;
  ctx.fillRect(x - 34, gy - 44, 68, 44);
  ctx.beginPath();                                              // gambrel roof
  ctx.moveTo(x - 39, gy - 44); ctx.lineTo(x - 24, gy - 60);
  ctx.lineTo(x + 24, gy - 60); ctx.lineTo(x + 39, gy - 44);
  ctx.closePath(); ctx.fillStyle = '#8d2b26'; ctx.fill();
  ctx.fillStyle = '#f0e6d2';                                    // trim + door
  ctx.fillRect(x - 12, gy - 30, 24, 30);
  ctx.fillStyle = '#7d221e';
  ctx.fillRect(x - 1.5, gy - 30, 3, 30);
  ctx.fillStyle = '#f0e6d2';
  ctx.beginPath(); ctx.arc(x, gy - 50, 5, 0, 7); ctx.fill();
}

function drawFence(x0, x1, gy) {
  ctx.strokeStyle = '#c9a978'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(x0, gy - 9); ctx.lineTo(x1, gy - 9);
  ctx.moveTo(x0, gy - 17); ctx.lineTo(x1, gy - 17);
  ctx.stroke();
  ctx.fillStyle = '#b08f5e';
  for (let x = x0; x <= x1; x += 34) ctx.fillRect(x, gy - 22, 3.4, 22);
}

function drawHaystack(x, gy, i) {
  const r = 11 + rnd(i + 21) * 4;
  ctx.fillStyle = '#d9b64e';
  ctx.beginPath(); ctx.arc(x, gy - r * 0.75, r, Math.PI, 0); ctx.fill();
  ctx.fillRect(x - r, gy - r * 0.75, r * 2, r * 0.75);
  ctx.strokeStyle = '#b8963a'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(x, gy - r * 0.75, r * 0.55, Math.PI, 0); ctx.stroke();
}

function drawConifer(x, gy, i) {
  const hh = 34 + rnd(i) * 26;
  ctx.fillStyle = '#5c4029';
  ctx.fillRect(x - 2.5, gy - 8, 5, 8);
  ctx.fillStyle = ['#2f6b3a', '#37793f', '#28603a'][i % 3];
  for (let k = 0; k < 3; k++) {
    const w = 17 - k * 4, y = gy - 8 - k * (hh / 4);
    ctx.beginPath();
    ctx.moveTo(x - w, y); ctx.lineTo(x, y - hh / 2.4); ctx.lineTo(x + w, y);
    ctx.closePath(); ctx.fill();
  }
}

function drawCone(x, gy) {
  ctx.fillStyle = '#e8621f';
  ctx.beginPath();
  ctx.moveTo(x - 5, gy); ctx.lineTo(x, gy - 13); ctx.lineTo(x + 5, gy);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 3.6, gy - 8, 7.2, 2.6);
  ctx.fillStyle = '#c9531a'; ctx.fillRect(x - 7, gy - 2.5, 14, 2.5);
}

function drawCabin(x, gy) {
  ctx.fillStyle = '#d8dde2'; ctx.strokeStyle = '#98a1a9'; ctx.lineWidth = 2;
  rrect(x - 26, gy - 30, 52, 30, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5d666e'; ctx.fillRect(x - 26, gy - 34, 52, 5);
  ctx.fillStyle = '#bfe9ff'; ctx.fillRect(x - 19, gy - 24, 15, 11);
  ctx.fillStyle = '#7d5c3c'; ctx.fillRect(x + 6, gy - 22, 12, 22);
}

function drawSpoilPile(x, gy, i) {
  const w = 34 + rnd(i + 41) * 26, hh = 16 + rnd(i + 7) * 12;
  ctx.fillStyle = '#7d5738';
  ctx.beginPath();
  ctx.moveTo(x - w, gy); ctx.quadraticCurveTo(x, gy - hh * 2, x + w, gy);
  ctx.closePath(); ctx.fill();
}

function drawSailboat(x, y, i) {
  const bob = Math.sin(T * 1.1 + i) * 2;
  ctx.fillStyle = '#f4f1e8';
  ctx.beginPath();
  ctx.moveTo(x - 15, y + bob); ctx.lineTo(x + 15, y + bob);
  ctx.lineTo(x + 9, y + 7 + bob); ctx.lineTo(x - 10, y + 7 + bob);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6b5a44'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, y + bob); ctx.lineTo(x, y - 26 + bob); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x + 1, y - 25 + bob); ctx.lineTo(x + 15, y - 2 + bob); ctx.lineTo(x + 1, y - 2 + bob);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e05a4a';
  ctx.beginPath();
  ctx.moveTo(x - 1, y - 22 + bob); ctx.lineTo(x - 11, y - 2 + bob); ctx.lineTo(x - 1, y - 2 + bob);
  ctx.closePath(); ctx.fill();
}

/* ------------------------------------------------------------ biome layout */
function drawFarm(bi, bx) {
  const gy = BAND_Y - 2;
  if (!onLand(bx + 700)) return;
  drawBarn(bx + 230, gy);
  drawHouse(bx + 470, gy, bi + 3);
  drawFarTree(bx + 590, gy, bi + 5);
  drawFence(bx + 660, bx + 1180, gy);
  for (let k = 0; k < 3; k++) {
    drawHorse(bx + 730 + k * 150 + Math.sin(T * 0.16 + bi + k * 2.1) * 28, gy, bi * 3 + k);
  }
  for (let k = 0; k < 3; k++) drawHaystack(bx + 1260 + k * 74, gy, bi + k);
}

function drawForest(bi, bx) {
  for (let k = 0; k < 26; k++) {
    const x = bx + 40 + k * 60 + rnd(bi * 40 + k) * 40;
    if (x < camX - 70 || x > camX + VW + 70 || !onLand(x)) continue;
    if ((k + bi) % 3 === 0) drawConifer(x, BAND_Y - 2, bi + k);
    else                    drawFarTree(x, BAND_Y - 2, bi * 7 + k);
  }
}

function drawRiverVillage(bi, bx) {
  const gy = BAND_Y - 2;
  for (let k = 0; k < 10; k++) {
    const x = bx + 70 + k * 150 + rnd(bi * 9 + k) * 50;
    if (x < camX - 120 || x > camX + VW + 120 || !onLand(x)) continue;
    if (k === 4)           drawChurch(x, gy);
    else if (k % 4 === 1)  drawFarTree(x, gy, bi + k);
    else                   drawHouse(x, gy, bi * 5 + k);
  }
}

function drawYard(bi, bx) {
  const gy = BAND_Y - 2;
  if (!onLand(bx + 700)) return;
  drawCabin(bx + 180, gy);
  drawSpoilPile(bx + 400, gy, bi);
  drawSpoilPile(bx + 1180, gy, bi + 2);
  drawDozer(bx + 640, gy, bi);
  drawMiniExcavator(bx + 950, gy, bi);
  for (let k = 0; k < 6; k++) drawCone(bx + 300 + k * 170, gy);
}

function drawOcean(bi, bx) {
  const sx = bx + 300 + rnd(bi + 13) * 420;
  if (sx > camX - 80 && sx < camX + VW + 80) drawSailboat(sx, waterSurfaceAt(sx) + 2, bi);
  drawWhale(bi, bx);
}

function drawBiomeProps() {
  const i0 = biomeIndexAt(camX - 220), i1 = biomeIndexAt(camX + VW + 220);
  for (let bi = i0; bi <= i1; bi++) {
    const bx = bi * BIOME_W;
    switch (biomeKind(bi)) {
      case 'farm':   drawFarm(bi, bx); break;
      case 'forest': drawForest(bi, bx); break;
      case 'river':  drawRiverVillage(bi, bx); break;
      case 'yard':   drawYard(bi, bx); break;
      case 'ocean':  drawOcean(bi, bx); break;
    }
  }
  drawDeer();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#3f8fd4');
  g.addColorStop(0.55, '#7fbbe6');
  g.addColorStop(1, '#cfe6f2');                       // haze thickens at the horizon
  ctx.fillStyle = g;
  ctx.fillRect(camX - 10, 0, VW + 20, VIEW_H);

  const sx = par(240, 0.02), sy = 84;                 // sun, with its glow
  const glow = ctx.createRadialGradient(sx, sy, 12, sx, sy, 150);
  glow.addColorStop(0, 'rgba(255,240,170,.85)');
  glow.addColorStop(0.28, 'rgba(255,236,150,.28)');
  glow.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 150, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff6c8';
  ctx.beginPath(); ctx.arc(sx, sy, 38, 0, 7); ctx.fill();

  drawMountains();
  drawClouds();
  drawBirds();

  // near hills, lit from the left and hazed into the distance
  ridgePath(0.20, FAR_HILLS);
  const hg = ctx.createLinearGradient(camX, 350, camX + VW * 0.6, 430);
  hg.addColorStop(0, '#93b984'); hg.addColorStop(1, '#6b9668');
  ctx.fillStyle = hg; ctx.fill();

  drawBand();
  drawBiomeProps();
}

function terrainPath(arr) {
  const i0 = Math.max(0, colAt(camX) - 2), i1 = Math.min(COLS - 1, colAt(camX + VW) + 2);
  ctx.beginPath();
  ctx.moveTo(i0 * COLW, VIEW_H + 10);
  for (let i = i0; i <= i1; i++) ctx.lineTo(i * COLW, arr[i]);
  ctx.lineTo(i1 * COLW, VIEW_H + 10);
  ctx.closePath();
  return [i0, i1];
}

// the wall of earth *behind* the machine, so an open hole reads as a
// cut-away through the ground rather than a window onto the sky
const back = new Float32Array(COLS);

function drawBackWall() {
  const a = Math.max(0, colAt(camX) - 4), b = Math.min(COLS - 1, colAt(camX + VW) + 4);
  for (let i = a; i <= b; i++) back[i] = Math.min(h0[i], h[i]);
  ctx.save();
  terrainPath(back);
  ctx.clip();
  for (const b of BANDS_DARK) { ctx.fillStyle = b.c; ctx.fillRect(camX - 10, b.y0, VW + 20, b.y1 - b.y0); }
  ctx.restore();
}

function drawTerrain() {
  ctx.save();
  const [i0, i1] = terrainPath(h);
  ctx.clip();

  // strata, each darkening with depth so the section reads as solid ground
  for (const b of BANDS) {
    const g = ctx.createLinearGradient(0, b.y0, 0, b.y1);
    g.addColorStop(0, mix(b.c, '#ffffff', 0.10));
    g.addColorStop(1, mix(b.c, '#2a1c10', 0.22));
    ctx.fillStyle = g;
    ctx.fillRect(camX - 10, b.y0, VW + 20, b.y1 - b.y0);
  }

  // grit, pebbles and the occasional buried stone
  for (let i = i0; i <= i1; i += 3) {
    const x = i * COLW, seed = i * 37;
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ctx.fillRect(x, h[i] + 18 + (seed % 120), 3.5, 3);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(x + 2, h[i] + 46 + ((seed * 7) % 150), 3, 2.5);
    if (i % 27 === 0) {
      ctx.fillStyle = 'rgba(80,72,64,.5)';
      ctx.beginPath();
      ctx.ellipse(x, h[i] + 60 + ((seed * 3) % 130), 5 + (seed % 4), 3.4, seed % 2, 0, 7);
      ctx.fill();
    }
  }

  // the freshly cut face is darker right under the surface line
  ctx.beginPath();
  ctx.moveTo((i0) * COLW, h[i0]);
  for (let i = i0; i <= i1; i++) ctx.lineTo(i * COLW, h[i]);
  for (let i = i1; i >= i0; i--) ctx.lineTo(i * COLW, h[i] + 17);
  ctx.closePath();
  ctx.fillStyle = 'rgba(52,34,18,.30)';
  ctx.fill();
  ctx.restore();

  // topsoil lip and grass, only where the ground has not been worked
  for (let i = i0; i <= i1; i++) {
    const x = i * COLW, y = h[i];
    if (disturbed[i]) {
      ctx.fillStyle = 'rgba(255,236,200,.13)';       // sunlit edge of bare dirt
      ctx.fillRect(x, y, COLW + 0.6, 2.2);
      continue;
    }
    ctx.fillStyle = '#4a8c3d';
    ctx.fillRect(x, y, COLW + 0.6, 12);
    ctx.fillStyle = '#63ad4f';
    ctx.fillRect(x, y, COLW + 0.6, 5.5);
    ctx.fillStyle = '#7fc766';
    ctx.fillRect(x, y, COLW + 0.6, 2);
    if (i % 4 === 0) {                                // tufts catching the light
      const t = (i * 53) % 7;
      ctx.fillStyle = '#6fbb57';
      ctx.fillRect(x + 1, y - 3 - (t % 3), 1.6, 4 + (t % 3));
    }
  }
}

function drawTrees() {
  for (const tx of TREES) {
    if (tx < camX - 80 || tx > camX + VW + 80) continue;
    const gy = groundAt(tx);
    ctx.fillStyle = '#7b5230';
    ctx.fillRect(tx - 7, gy - 54, 14, 56);
    ctx.fillStyle = '#4f9c40';
    ctx.beginPath();
    ctx.arc(tx, gy - 74, 34, 0, 7);
    ctx.arc(tx - 26, gy - 58, 24, 0, 7);
    ctx.arc(tx + 26, gy - 58, 24, 0, 7);
    ctx.fill();
  }
}

function rrect(x, y, w, hh, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + hh, r);
  ctx.arcTo(x + w, y + hh, x, y + hh, r);
  ctx.arcTo(x, y + hh, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// A boom/stick member: tapered steel, lit along its top edge, with a weld seam
// and a pin boss at each end.
function limb(a, b, w, base) {
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(ang);

  const wa = w, wb = w * 0.74;                       // tapers toward the far pin
  ctx.beginPath();
  ctx.moveTo(-w * 0.45, -wa / 2);
  ctx.lineTo(len + w * 0.45, -wb / 2);
  ctx.lineTo(len + w * 0.45, wb / 2);
  ctx.lineTo(-w * 0.45, wa / 2);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -wa / 2, 0, wa / 2);
  g.addColorStop(0, mix(base, '#ffffff', 0.34));
  g.addColorStop(0.42, base);
  g.addColorStop(1, mix(base, '#3a2a06', 0.34));
  ctx.fillStyle = g;
  ctx.strokeStyle = '#7d5c05'; ctx.lineWidth = 2.2;
  ctx.fill(); ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.2;   // weld seam
  ctx.beginPath();
  ctx.moveTo(len * 0.28, -wa * 0.16); ctx.lineTo(len * 0.28, wa * 0.16);
  ctx.stroke();
  ctx.restore();

  for (const p of [a, b]) {                                   // pin bosses
    ctx.fillStyle = '#6b5a1c';
    ctx.beginPath(); ctx.arc(p.x, p.y, w * 0.30, 0, 7); ctx.fill();
    ctx.fillStyle = '#8f8f96';
    ctx.beginPath(); ctx.arc(p.x, p.y, w * 0.16, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(p.x - w * 0.05, p.y - w * 0.05, w * 0.06, 0, 7); ctx.fill();
  }
}

// A hydraulic ram: a barrel anchored at `a` and a chromed rod reaching to `b`,
// so the rod visibly extends and retracts as the joint moves.
function ram(a, b, barrelW, minBarrel) {
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const barrel = Math.min(len * 0.62, Math.max(minBarrel, len * 0.5));
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(ang);

  ctx.fillStyle = '#c9ccd2';                                  // chrome rod
  ctx.fillRect(barrel - 2, -barrelW * 0.26, len - barrel + 2, barrelW * 0.52);
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillRect(barrel - 2, -barrelW * 0.24, len - barrel + 2, barrelW * 0.16);

  const g = ctx.createLinearGradient(0, -barrelW / 2, 0, barrelW / 2);
  g.addColorStop(0, '#8d939c'); g.addColorStop(0.4, '#5f666f'); g.addColorStop(1, '#33383f');
  ctx.fillStyle = g;
  rrect(0, -barrelW / 2, barrel, barrelW, barrelW * 0.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(2, -barrelW * 0.42, barrel - 4, barrelW * 0.16);
  ctx.restore();

  ctx.fillStyle = '#4a4f57';
  ctx.beginPath(); ctx.arc(a.x, a.y, barrelW * 0.36, 0, 7); ctx.fill();
}

function drawDriver(gx, gy, gw, gh) {
  const cx = gx + gw * 0.55;        // sits toward the front of the cab
  const hy = gy + gh * 0.40;        // head centre
  const r  = gh * 0.24;             // head radius

  // seat back behind him
  ctx.fillStyle = '#4a4038';
  rrect(cx - r * 2.5, hy - r * 1.1, r * 1.1, gh, r * 0.4); ctx.fill();

  // torso in a hi-vis vest
  ctx.fillStyle = '#ff8a3d';
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.2, hy + r * 2.1, r * 1.62, r * 1.3, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(cx - r * 1.82, hy + r * 2.05, r * 3.24, gh);
  ctx.fillStyle = 'rgba(255,255,255,.7)';           // reflective stripe
  ctx.fillRect(cx - r * 1.3, hy + r * 1.95, r * 2.6, r * 0.22);

  // neck, mostly hidden by the chin so it reads as depth, not a patch
  ctx.fillStyle = '#e0ac82';
  rrect(cx - r * 0.32, hy + r * 0.5, r * 0.64, r * 0.72, r * 0.2); ctx.fill();

  // head
  ctx.fillStyle = '#f4c9a2';
  ctx.beginPath(); ctx.arc(cx, hy, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8b58c';                        // ear
  ctx.beginPath(); ctx.arc(cx - r * 0.92, hy + r * 0.12, r * 0.24, 0, 7); ctx.fill();

  // ball cap: crown, brim pointing forward, button on top
  ctx.fillStyle = '#2f6fd0';
  ctx.beginPath();
  ctx.arc(cx - r * 0.04, hy - r * 0.1, r * 1.06, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.92, hy - r * 0.4, r * 0.8, r * 0.22, -0.1, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#5a94e8';
  ctx.beginPath(); ctx.arc(cx - r * 0.04, hy - r * 1.12, r * 0.15, 0, 7); ctx.fill();

  // face
  ctx.fillStyle = '#f6a58f';                        // cheek
  ctx.beginPath(); ctx.arc(cx - r * 0.28, hy + r * 0.46, r * 0.22, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a2a1c';                        // eye
  ctx.beginPath(); ctx.arc(cx + r * 0.5, hy + r * 0.14, r * 0.16, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3a2a1c';                      // grin
  ctx.lineWidth = Math.max(1, r * 0.15);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx + r * 0.28, hy + r * 0.4, r * 0.4, Math.PI * 0.1, Math.PI * 0.8);
  ctx.stroke();
}

function drawTruck() {
  const T = TRUCK;
  if (T.rampX1 + 90 < camX || T.cabX0 - 90 > camX + VW) return;

  const deckTop = T.deckY, deckBot = T.deckY + 13;
  const frameTop = deckBot, frameBot = deckBot + 12;
  const wheels = [102, 320, 386];

  // ---- ramp, drawn first so the deck edge laps over its top end
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(T.deckX1 - 4, deckTop);
  ctx.lineTo(T.rampX1, GROUND_Y);
  ctx.lineTo(T.rampX1, GROUND_Y + 2.5);        // tapers to a lip on the ground
  ctx.lineTo(T.deckX1 - 4, deckTop + 13);
  ctx.closePath();
  ctx.fillStyle = '#79808b'; ctx.fill();
  ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.clip();
  ctx.fillStyle = 'rgba(240,192,32,.85)';           // grip bars
  const rl = Math.hypot(T.rampX1 - T.deckX1, GROUND_Y - deckTop);
  ctx.translate(T.deckX1 - 4, deckTop);
  ctx.rotate(Math.atan2(GROUND_Y - deckTop, T.rampX1 - T.deckX1 + 4));
  for (let d = 10; d < rl; d += 30) ctx.fillRect(d, 1, 13, 5);
  ctx.restore();

  // ---- wheels
  ctx.fillStyle = '#23272c';
  for (const wx of wheels) { ctx.beginPath(); ctx.arc(wx, GROUND_Y - 21, 21, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#9aa1a9';
  for (const wx of wheels) { ctx.beginPath(); ctx.arc(wx, GROUND_Y - 21, 8.5, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#6d747c';
  for (const wx of wheels) { ctx.beginPath(); ctx.arc(wx, GROUND_Y - 21, 3, 0, 7); ctx.fill(); }

  // ---- chassis rail
  ctx.fillStyle = '#3c4148';
  ctx.fillRect(T.cabX0 + 8, frameTop, T.deckX1 - T.cabX0 - 8, frameBot - frameTop);

  // ---- deck
  ctx.fillStyle = '#8a929c';
  rrect(T.deckX0 - 8, deckTop, T.deckX1 - T.deckX0 + 12, 13, 3); ctx.fill();
  ctx.strokeStyle = '#666d76'; ctx.lineWidth = 1.5;
  for (let x = T.deckX0 + 12; x < T.deckX1 - 6; x += 28) {
    ctx.beginPath(); ctx.moveTo(x, deckTop + 2.5); ctx.lineTo(x, deckTop + 10.5); ctx.stroke();
  }

  // ---- headboard behind the truck cab
  ctx.fillStyle = '#c9302f'; ctx.strokeStyle = '#8f2020'; ctx.lineWidth = 2.5;
  rrect(T.deckX0 - 6, deckTop - 44, 13, 46, 3); ctx.fill(); ctx.stroke();

  // ---- truck cab, facing left
  const cy0 = GROUND_Y - 126, cy1 = frameBot;
  ctx.fillStyle = '#d83a3a'; ctx.strokeStyle = '#8f2020'; ctx.lineWidth = 3;
  rrect(T.cabX0, cy0, T.cabX1 - T.cabX0, cy1 - cy0, 11); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#bfe9ff';
  rrect(T.cabX0 + 9, cy0 + 11, 52, 36, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.moveTo(T.cabX0 + 11, cy0 + 47); ctx.lineTo(T.cabX0 + 34, cy0 + 11);
  ctx.lineTo(T.cabX0 + 46, cy0 + 11); ctx.lineTo(T.cabX0 + 23, cy0 + 47);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9aa1a9';                        // bumper
  rrect(T.cabX0 - 6, cy1 - 18, 14, 18, 3); ctx.fill();
  ctx.fillStyle = '#ffe27a';                        // headlight
  ctx.beginPath(); ctx.arc(T.cabX0 + 8, cy0 + 62, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a4a4a';                        // stack
  ctx.fillRect(T.cabX1 - 12, cy0 - 16, 7, 20);
}

/* ------------------------------------------------------------- dump truck */
// The bucket only loads the truck when it is tipping out over the open bed.
function bucketOverBed(tip) {
  if (DTRUCK.state !== 'parked' || DTRUCK.fill >= 1) return false;
  // generous window: a 4-year-old will not line this up precisely, and it works
  // from either side of the truck. The bucket must still be raised above the
  // bed wall, so "lift it over the side" is the thing being taught.
  return tip.x > DTRUCK.x - 95 && tip.x < DTRUCK.x + 22
      && tip.y < DTRUCK.y - 28 && tip.y > DTRUCK.y - 165;
}

function updateDumpTruck(dt) {
  const T = DTRUCK;

  // rides the ground, so digging underneath lowers it instead of leaving it afloat
  let top = 1e9;
  for (let dx = -72; dx <= 68; dx += 8) top = Math.min(top, surfaceAt(T.x + dx));
  T.y = lerp(T.y, top, 1 - Math.pow(0.0008, dt));

  switch (T.state) {
    case 'parked':
      if (T.fill >= 1) {
        T.wait += dt;                       // beat so the kid sees it fill up
        if (T.wait > 0.7) { T.wait = 0; T.state = 'hauling'; playTruckHorn(); }
      }
      break;

    case 'hauling':
      T.x = Math.min(DT_AWAY, T.x + 200 * dt);
      if (T.x >= DT_AWAY) { T.state = 'tipping'; playTipRumble(); }
      break;

    case 'tipping':
      T.tip = Math.min(1, T.tip + dt * 0.85);
      if (T.tip > 0.3 && T.fill > 0) {
        const give = Math.min(T.fill, 0.85 * dt);
        T.fill -= give;
        spawnClod(T.x - 98 + (Math.random() - 0.5) * 30, T.y - 46,
                  give * DUMP_CAP, -40 - Math.random() * 30, -10);
      }
      if (T.tip >= 1 && T.fill <= 0.002) { T.fill = 0; T.state = 'lowering'; playSettle(); }
      break;

    case 'lowering':
      T.tip = Math.max(0, T.tip - dt * 1.1);
      if (T.tip <= 0) T.state = 'returning';
      break;

    case 'returning':
      T.x = Math.max(DT_HOME, T.x - 200 * dt);
      if (T.x <= DT_HOME) { T.x = DT_HOME; T.state = 'parked'; }
      break;
  }
}

function drawDumpTruck() {
  const T = DTRUCK, gy = T.y;
  if (T.x + 160 < camX || T.x - 160 > camX + VW) return;

  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.ellipse(T.x - 4, gy - 1, 86, 8, 0, 0, 7); ctx.fill();

  const wheelsAt = [-54, -16, 50];
  ctx.fillStyle = '#23272c';
  for (const dx of wheelsAt) { ctx.beginPath(); ctx.arc(T.x + dx, gy - 18, 18, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#9aa1a9';
  for (const dx of wheelsAt) { ctx.beginPath(); ctx.arc(T.x + dx, gy - 18, 7, 0, 7); ctx.fill(); }

  ctx.fillStyle = '#3c4148';                                  // chassis
  ctx.fillRect(T.x - 78, gy - 44, 150, 12);

  // ---- bed, pivoting about its rear bottom corner when it tips
  ctx.save();
  ctx.translate(T.x - 80, gy - 40);
  ctx.rotate(-T.tip * 0.55);

  if (T.fill > 0.01) {                                        // load inside
    const fh = 36 * T.fill;
    ctx.fillStyle = '#8b5a2f';
    ctx.fillRect(8, -8 - fh, 80, fh);
    ctx.fillStyle = '#9a6b41';
    ctx.beginPath();
    ctx.moveTo(8, -8 - fh);
    ctx.quadraticCurveTo(48, -8 - fh - 13 * T.fill, 88, -8 - fh);
    ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = '#e0913a'; ctx.strokeStyle = '#8f5a1c'; ctx.lineWidth = 2.5;
  rrect(0, -8, 96, 8, 2); ctx.fill(); ctx.stroke();           // floor
  rrect(0, -48, 9, 42, 2); ctx.fill(); ctx.stroke();          // rear wall
  rrect(87, -48, 9, 42, 2); ctx.fill(); ctx.stroke();         // front wall
  ctx.restore();

  // ---- cab, facing right
  ctx.fillStyle = '#3f8ecc'; ctx.strokeStyle = '#255f92'; ctx.lineWidth = 3;
  rrect(T.x + 18, gy - 90, 56, 52, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#bfe9ff';
  rrect(T.x + 34, gy - 80, 34, 26, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.moveTo(T.x + 36, gy - 54); ctx.lineTo(T.x + 52, gy - 80);
  ctx.lineTo(T.x + 61, gy - 80); ctx.lineTo(T.x + 45, gy - 54);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9aa1a9';
  rrect(T.x + 70, gy - 52, 12, 16, 3); ctx.fill();            // bumper
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.arc(T.x + 72, gy - 58, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(T.x + 20, gy - 108, 6, 20);                    // stack
}

function drawExcavator() {
  const P = armPoints(ex.arm);
  ctx.save();
  ctx.translate(ex.x, ex.y);
  ctx.rotate(ex.rot);
  ctx.scale(ex.facing, 1);

  // contact shadow, tight under the tracks
  ctx.fillStyle = 'rgba(0,0,0,.26)';
  ctx.beginPath(); ctx.ellipse(0, 1, RIG.trackW * 0.5, 6, 0, 0, 7); ctx.fill();

  // ---- undercarriage: sprocket and idler at the ends, rollers between,
  // with the rubber belt wrapped around them
  const tw = RIG.trackW, th = RIG.trackH;
  const R = th * 0.5, ex0 = -tw / 2 + R, ex1 = tw / 2 - R;
  ctx.beginPath();
  ctx.moveTo(ex0, -th); ctx.lineTo(ex1, -th);
  ctx.arc(ex1, -R, R, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(ex0, 0);
  ctx.arc(ex0, -R, R, Math.PI / 2, -Math.PI / 2);
  ctx.closePath();
  const tg = ctx.createLinearGradient(0, -th, 0, 0);
  tg.addColorStop(0, '#4b525a'); tg.addColorStop(0.5, '#31363d'); tg.addColorStop(1, '#1b1f24');
  ctx.fillStyle = tg; ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ex0, -th); ctx.lineTo(ex1, -th);
  ctx.arc(ex1, -R, R, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(ex0, 0);
  ctx.arc(ex0, -R, R, Math.PI / 2, -Math.PI / 2);
  ctx.closePath(); ctx.clip();
  const off = ((ex.tread * ex.facing) % 13 + 13) % 13;
  for (let x = -tw / 2 - 13 + off; x < tw / 2 + 13; x += 13) {   // grouser plates
    ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fillRect(x, -th, 4.5, th);
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x + 4.5, -th, 2, th);
  }
  ctx.fillStyle = 'rgba(120,95,60,.28)';                          // caked mud
  ctx.fillRect(-tw / 2, -7, tw, 7);
  ctx.restore();

  ctx.fillStyle = '#20242a';                                      // track frame
  rrect(-tw / 2 + 8, -th + 5, tw - 16, th - 12, 4); ctx.fill();
  for (const [wx, r] of [[ex0, 8.5], [ex1, 8.5], [-16, 5], [16, 5]]) {
    const wg = ctx.createRadialGradient(wx - r * 0.3, -R - r * 0.3, r * 0.2, wx, -R, r);
    wg.addColorStop(0, '#b9c0c8'); wg.addColorStop(1, '#6a7078');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.arc(wx, -R, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#42484f';
    ctx.beginPath(); ctx.arc(wx, -R, r * 0.34, 0, 7); ctx.fill();
  }

  // ---- house, lit from above
  ctx.fillStyle = formGrad(0, -th - RIG.houseH, 0, -th, '#ffc61a');
  ctx.strokeStyle = '#8a6a05'; ctx.lineWidth = 3;
  rrect(-RIG.houseW / 2 - 6, -th - RIG.houseH, RIG.houseW + 12, RIG.houseH, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.13)';                              // engine hatch
  rrect(-RIG.houseW / 2 + 6, -th - RIG.houseH + 9, 40, RIG.houseH - 18, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1.4;        // louvres
  for (let k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(-RIG.houseW / 2 + 12, -th - RIG.houseH + 15 + k * 6);
    ctx.lineTo(-RIG.houseW / 2 + 40, -th - RIG.houseH + 15 + k * 6);
    ctx.stroke();
  }

  // counterweight, cast and heavy
  ctx.fillStyle = formGrad(0, -th - 34, 0, -th - 4, '#e0a800', 0.14, 0.34);
  rrect(-RIG.houseW / 2 - 12, -th - 36, 22, 34, 7); ctx.fill();
  ctx.strokeStyle = '#8a6a05'; ctx.lineWidth = 2; ctx.stroke();

  // ---- cab (a little bigger now, to make room for the driver)
  const cabX = -20, cabY = -th - RIG.houseH - 54, cabW = 54, cabH = 58;
  ctx.fillStyle = '#ffd748'; ctx.strokeStyle = '#8a6a05'; ctx.lineWidth = 3;
  rrect(cabX, cabY, cabW, cabH, 11); ctx.fill(); ctx.stroke();

  // glass, with the driver clipped inside it
  const gx = cabX + 7, gy = cabY + 7, gw = cabW - 14, gh = cabH - 15;
  ctx.save();
  rrect(gx, gy, gw, gh, 7);
  ctx.fillStyle = '#bfe9ff'; ctx.fill();
  ctx.clip();
  drawDriver(gx, gy, gw, gh);
  ctx.restore();

  // a thin streak of reflection across the glass, kept faint so he still reads
  ctx.save();
  rrect(gx, gy, gw, gh, 7); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  ctx.beginPath();
  ctx.moveTo(gx - 4, gy + gh); ctx.lineTo(gx + gw * 0.42, gy - 4);
  ctx.lineTo(gx + gw * 0.62, gy - 4); ctx.lineTo(gx + gw * 0.16, gy + gh);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // window frame
  ctx.strokeStyle = '#8a6a05'; ctx.lineWidth = 2.5;
  rrect(gx, gy, gw, gh, 7); ctx.stroke();

  // exhaust stack, at the rear over the engine
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-36, -th - RIG.houseH - 16, 8, 18);
  ctx.fillStyle = '#5f5f5f';
  rrect(-38, -th - RIG.houseH - 20, 12, 6, 2.5); ctx.fill();

  // ---- arm. The rams are anchored to the house and to the boom, so their rods
  // visibly draw in and out as the arm sweeps through its arc.
  const boomAnchor = { x: -6, y: -th - RIG.houseH + 10 };
  const boomMid = { x: P.pivot.x + (P.boomTip.x - P.pivot.x) * 0.46,
                    y: P.pivot.y + (P.boomTip.y - P.pivot.y) * 0.46 };
  ram(boomAnchor, boomMid, 13, 26);

  limb(P.pivot, P.boomTip, 20, '#ffc61a');

  const stickAnchor = { x: P.pivot.x + (P.boomTip.x - P.pivot.x) * 0.34,
                        y: P.pivot.y + (P.boomTip.y - P.pivot.y) * 0.34 - 13 };
  const stickMid = { x: P.boomTip.x + (P.stickTip.x - P.boomTip.x) * 0.30,
                     y: P.boomTip.y + (P.stickTip.y - P.boomTip.y) * 0.30 };
  ram(stickAnchor, stickMid, 11, 22);

  limb(P.boomTip, P.stickTip, 16, '#ffd23c');

  const bktAnchor = { x: P.boomTip.x + (P.stickTip.x - P.boomTip.x) * 0.18,
                      y: P.boomTip.y + (P.stickTip.y - P.boomTip.y) * 0.18 - 10 };
  const bktLink = { x: P.stickTip.x + Math.cos(P.ang.bucket - 1.5) * 15,
                    y: P.stickTip.y + Math.sin(P.ang.bucket - 1.5) * 15 };
  ram(bktAnchor, bktLink, 9, 18);
  ctx.strokeStyle = '#6b5a1c'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bktLink.x, bktLink.y); ctx.lineTo(P.stickTip.x, P.stickTip.y);
  ctx.stroke();

  // ---- bucket
  const a = P.ang.bucket;
  ctx.save();
  ctx.translate(P.stickTip.x, P.stickTip.y);
  ctx.rotate(a);
  const L = RIG.bucket;
  ctx.beginPath();
  ctx.moveTo(-4, -17);
  ctx.lineTo(L + 4, -9);
  ctx.lineTo(L + 6, 5);
  ctx.quadraticCurveTo(L * 0.5, 22, -6, 12);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, -17, 0, 20);
  bg.addColorStop(0, mix('#e8a300', '#ffffff', 0.30));
  bg.addColorStop(0.45, '#e8a300');
  bg.addColorStop(1, mix('#e8a300', '#2e2205', 0.42));
  ctx.fillStyle = bg; ctx.strokeStyle = '#7d5c05'; ctx.lineWidth = 2.5;
  ctx.fill(); ctx.stroke();

  // wear plate along the cutting edge, polished bright by the digging
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-4, -17); ctx.lineTo(L + 4, -9); ctx.lineTo(L + 6, 5);
  ctx.quadraticCurveTo(L * 0.5, 22, -6, 12); ctx.closePath();
  ctx.clip();
  ctx.fillStyle = 'rgba(190,196,204,.55)';
  ctx.beginPath();
  ctx.moveTo(L + 8, 6); ctx.quadraticCurveTo(L * 0.55, 24, -8, 13);
  ctx.lineTo(-8, 6); ctx.quadraticCurveTo(L * 0.55, 17, L + 8, -1);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#4a3d0d';                       // teeth, worn to a point
  for (let i = 0; i < 4; i++) {
    const ty = -9 + i * 4.6;
    ctx.beginPath();
    ctx.moveTo(L + 3, ty); ctx.lineTo(L + 12, ty + 1.7); ctx.lineTo(L + 3, ty + 3.6);
    ctx.closePath(); ctx.fill();
  }

  if (ex.load > 30) {                              // heaped load, lit on top
    const f = Math.min(1, ex.load / CAPACITY);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-4, -17); ctx.lineTo(L + 4, -9); ctx.lineTo(L + 6, 5);
    ctx.quadraticCurveTo(L * 0.5, 22, -6, 12); ctx.closePath();
    ctx.clip();
    const dg = ctx.createLinearGradient(0, 20 - 34 * f, 0, 22);
    dg.addColorStop(0, '#a5713f'); dg.addColorStop(1, '#6d4526');
    ctx.fillStyle = dg;
    ctx.fillRect(-8, 20 - 34 * f, L + 20, 40);
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    for (let k = 0; k < 7; k++) {
      ctx.fillRect(-6 + k * 6, 24 - 34 * f + ((k * 13) % 9), 3, 2.4);
    }
    ctx.restore();
  }
  ctx.restore();

  ctx.restore();
}

function render() {
  // camera follows with a deadzone
  const want = ex.x - VW * 0.42;
  camX = lerp(camX, Math.max(0, Math.min(WORLD_W - VW, want)), 0.07);

  ctx.setTransform(cv.width / innerWidth, 0, 0, cv.height / innerHeight, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-camX, 0);

  drawSky();
  drawBackWall();
  drawTrees();
  drawTerrain();
  drawTruck();
  drawDumpTruck();
  drawExcavator();
  drawClods();
  drawPuffs();

  ctx.restore();
}

/* ------------------------------------------------------------------ loop */
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
lastInput = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
